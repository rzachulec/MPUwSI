"D5#1":
  frazy: [["przekonanie co do bieżącego stanu p jest takie, że p=0", "¬p", "Know"]]
  spostrzezenia: "Pusta klasa zauważona. Wiedza dziedzinowa: kombinacja q=1 ∧ r=1 „nielogiczna w kontekście typowych repozytoriów”, commity dokumentacyjne „łatwiejsze”, zmiana zależności „może wymagać instalacji paczek”; na końcu reinterpretacja, że zmiana zależności „może być błędnie zidentyfikowana lub traktowana jako część dokumentacji”. Rozstrzyga reguła r=1 ⇒ p=0 i Naive Bayes; fałsz „r=1: 7/7 (u6–u12)” (u9, u10 mają r=0). 4645 tokenów analizy."
  ocena: "zbyt pewna przy pustej klasie."
"D5#2":
  frazy: [["przekonanie, że build zakończył się niepowodzeniem, jest umiarkowanie wysokie", "p", "Bel"], ["Prawdopodobnie p = 1", "p", "Bel"]]
  spostrzezenia: "Pusta klasa zauważona. Rozbudowany argument dziedzinowy: r=1 to tylko „brak zmian w kodzie”, a ryzyko z q=1 (błąd instalacji, konflikty wersji) pozostaje – „r=1 nie zapewnia ochrony przed błędami w zależnościach”. Fałsze: „(q=1, s=0): p=1 w 2/2”, „s=1: 2/8”."
  ocena: "zbyt pewna przy pustej klasie (kierunek przeciwny do D5#1)."
"D5#3":
  frazy: [["niepowodzenie jest bardziej prawdopodobne", "p", "Pos/Bel"]]
  spostrzezenia: "Brak danych dla q=1 ∧ r=1 rozstrzygnięty argumentem dziedzinowym: zmiana zależności to „ciężka” zmiana (brakujące pakiety, konflikty wersji), dokumentacja „lekka”."
  ocena: "zbyt pewna przy pustej klasie; wyraźny wpływ wiedzy dziedzinowej."

